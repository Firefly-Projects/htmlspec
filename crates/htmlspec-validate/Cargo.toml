[package]
name = "htmlspec-validate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "HTMLSpec rule engine and diagnostics"
readme = "README.md"

[lints]
workspace = true

[dependencies]
htmlspec-schema = { workspace = true }
htmlspec-parse = { workspace = true }
# The asset rules resolve a document's references against the project's store, so
# the engine needs the store type. Reading the filesystem directly from a rule would
# let a rule depend on a path that only exists on one machine.
htmlspec-assets = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
kuchikiki = { workspace = true }

[dev-dependencies]
htmlspec-format = { workspace = true }
# The formatter's asset references are checked against the tree the asset rules walk, over
# generated documents as well as the repository's own.
proptest = { workspace = true }
serde_json = { workspace = true }
pretty_assertions = { workspace = true }
