[package]
name = "htmlspec-format"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "HTMLSpec canonical serializer"
readme = "README.md"

[lints]
workspace = true

[dependencies]
htmlspec-parse = { workspace = true }
# Reference rewriting reads the store to decide whether a reference is fillable, and
# the embedded asset table to decide what to fill it with.
htmlspec-assets = { workspace = true }
kuchikiki = { workspace = true }

[dev-dependencies]
# The property generator draws its vocabulary from the published schema rather
# than restating it, so a contract change reaches the properties without an edit.
htmlspec-schema = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
pretty_assertions = { workspace = true }
