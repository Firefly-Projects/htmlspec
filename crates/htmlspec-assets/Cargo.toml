[package]
name = "htmlspec-assets"
version.workspace = true
edition.workspace = true
# Every license the four bundled libraries carry, theirs and those of the libraries bundled
# inside them, beside this crate's own MIT. DOMPurify is MPL-2.0 or Apache-2.0 and is taken
# under Apache-2.0. Each text is in THIRD-PARTY-LICENSES, beside this crate's own LICENSE.
license = "MIT AND BSD-3-Clause AND ISC AND Apache-2.0 AND Unlicense"
repository.workspace = true
rust-version.workspace = true
description = "The templates, stylesheets, and pinned diagram and chart libraries HTMLSpec documents render with"
readme = "README.md"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

# The asset table is generated from the lockfile rather than hand-written, so an
# address is recorded in one place. See build.rs.
[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
# The rendered-save test asserts its property through the projection, which is the
# strongest available statement of "the source survived": the model a consumer
# receives is the same for the saved copy and the file on disk.
htmlspec-parse = { workspace = true }
# A dev-dependency only, and deliberately: the templates declare an artifact kind,
# and the vocabulary belongs to the schema. This crate reads it to *check* that
# every template names a kind the contract enumerates. Depending on the schema at
# build time would invert the layering — the schema crate is a leaf, and a template
# is a document rather than a consumer of the model.
htmlspec-schema = { workspace = true }
