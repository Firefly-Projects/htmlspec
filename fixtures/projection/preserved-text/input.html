<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="htmlspec-version" content="0.1.0">
<meta name="htmlspec-kind" content="specification">
<title>Preserved text</title>
</head>
<body>
<main>
<!-- 6.2: a figure's source is preserved byte-for-byte, with no trimming and no
     normalization, including internal indentation and blank lines. -->
<figure id="figure-preserved">
<figcaption>A diagram whose source keeps its own indentation.</figcaption>
<details>
<summary>Diagram source</summary>
<pre class="mermaid">graph LR
  A[One] --&gt; B[Two]

    C[Indented further]
</pre>
</details>
</figure>
</main>
</body>
</html>
