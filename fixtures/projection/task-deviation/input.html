<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="htmlspec-version" content="0.1.0">
<meta name="htmlspec-kind" content="tasks">
<title>A task done another way than its words say</title>
</head>
<body>
<main>
<!-- 4.0, 4.5: a task accepts a deviation paragraph, which projects into its own
     field as normalized text. It is not a note and not a reason, and an unmarked
     paragraph beside it is still a note. A task with no deviation, or only an
     empty one, projects none. -->
<section class="task" id="task-as-written" data-state="done">
<h2>Add the subcommand</h2>
<p data-field="deviation"> </p>
</section>

<section class="task" id="task-done-differently" data-state="done">
<h2>Add the subcommand to the hand-written list</h2>
<p>Found while the check was being written.</p>
<p data-field="deviation">There is no hand-written list. The check resolves each
   invocation against the command tree, so the subcommand was covered the moment
   it existed.</p>
<p data-field="note">See the invocation test.</p>
</section>
</main>
</body>
</html>
