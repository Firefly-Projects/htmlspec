<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="htmlspec-version" content="0.1.0">
<meta name="htmlspec-kind" content="specification">
<title>A saved rendered page</title>
</head>
<body>
<main>
<!-- 7.5: this is what a page saved from a rendered DOM looks like. The renderer
     drew into a sibling element and never over the source, so the source is
     still here and the model is identical to the unrendered document's. -->
<figure id="figure-rendered">
<figcaption>A diagram, as saved from a rendered page.</figcaption>
<div class="mermaid-rendered" aria-hidden="true">
<svg viewBox="0 0 100 20" xmlns="http://www.w3.org/2000/svg"><title>A rendered diagram</title></svg>
</div>
<details>
<summary>Diagram source</summary>
<pre class="mermaid">graph LR
  A --&gt; B</pre>
</details>
</figure>
</main>
</body>
</html>
