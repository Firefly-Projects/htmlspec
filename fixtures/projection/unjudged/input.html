<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="htmlspec-version" content="0.1.0">
<meta name="htmlspec-kind" content="tasks">
<title>What the projection does not decide</title>
</head>
<body>
<main>
<!-- 10.1: none of these is a projection fault. Each survives into the model so
     that the validator reports it against a schema location: a prefix that does
     not match its unit type, an unrecognized change state, an attribute value
     outside its enumeration, a reference that resolves to nothing, and a
     duplicate identifier. -->
<section class="task" id="risk-wrong-prefix" data-state="todo" data-change="pending">
<h2>A task carrying a risk prefix and an unknown change state</h2>
</section>

<section class="task" id="task-bad-state" data-state="Done" data-refs="req-does-not-exist">
<h2>A task with a wrongly cased state and a dangling reference</h2>
</section>

<section class="task" id="task-bad-state" data-state="todo">
<h2>A second task sharing the first task's identifier</h2>
</section>

<!-- 10.1: a partial verification that states nothing it did not check is a
     validator rule, so the projection records the outcome and judges nothing. -->
<section class="verification" id="verify-partly-unstated" data-outcome="partial" data-refs="req-does-not-exist">
<h2>A partial verification stating nothing it did not check</h2>
<p data-field="method">How the part it reached was checked.</p>
</section>

<!-- 10.1.1: a figure identifier shares the document's identifier namespace, so
     the validator's uniqueness rule covers it even though a figure is not a
     unit. The projection records it and judges nothing. -->
<figure id="task-bad-state">
<figcaption>A figure sharing a task's identifier.</figcaption>
<p>The projection produces the model. It does not judge it.</p>
</figure>
</main>
</body>
</html>
