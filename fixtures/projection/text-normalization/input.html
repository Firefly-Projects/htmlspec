<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="htmlspec-version" content="0.1.0">
<meta name="htmlspec-kind" content="specification">
<title>Normalized text</title>
</head>
<body>
<main>
<section class="requirement" id="req-normalized-text">
<h2>A   title
    broken   across
lines</h2>
<!-- 6.1: every whitespace run becomes one space, then the result is trimmed. -->
<p>
  The system MUST
  normalize   whitespace.
</p>
<!-- 6.3: a character reference is resolved first. -->
<p>Rock &amp; roll MUST work, and 3 &lt; 4 MUST hold.</p>
<!-- 6.4: a comment contributes no text, so the parts concatenate. -->
<p>The system <!-- an aside -->MUST ignore a comment.</p>
<article class="scenario" id="scenario-normalized">
<h3>Whitespace  is
normalized  here  too</h3>
<dl>
<dt>When</dt>
<dd>Text spans
  several lines.</dd>
<dt>Then</dt>
<dd>It projects as one line.</dd>
</dl>
</article>
</section>
</main>
</body>
</html>
