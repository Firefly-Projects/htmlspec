<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="htmlspec-version" content="0.1.0">
<meta name="htmlspec-kind" content="specification">
<title>Figures</title>
</head>
<body>
<main>
<!-- 7.3: the first pre decides the kind. 7.4: a details wrapper is
     presentational. 7.1: the identifier is optional. -->
<figure id="figure-mermaid">
<figcaption>A Mermaid diagram.</figcaption>
<details>
<summary>Diagram source</summary>
<pre class="mermaid">graph LR
  A --&gt; B</pre>
</details>
</figure>

<figure id="figure-vega-lite">
<figcaption>A Vega-Lite chart.</figcaption>
<pre class="vega-lite">{"mark": "bar"}</pre>
</figure>

<figure id="figure-code">
<figcaption>A code excerpt.</figcaption>
<pre><code>let answer = 42;</code></pre>
</figure>

<figure id="figure-math">
<figcaption>An equation, in native MathML.</figcaption>
<math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
<mn>4.5</mn>
</math>
</figure>

<figure>
<figcaption>A prose figure with no identifier and no source.</figcaption>
<p>An ordinary table or image carries no visualization source.</p>
</figure>
</main>
</body>
</html>
