<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- 9.2: the contract version projects from its own meta element. -->
<meta name="htmlspec-version" content="0.1.0">
<!-- 9.3: the artifact kind projects from its own meta element, and the value is
     carried through unchanged. This document declares `tasks`, which is the kind
     whose stage the three task units below belong to. -->
<meta name="htmlspec-kind" content="tasks">
<!-- 9.1: the subject projects from the title element of the head. -->
<title>Document metadata projects from the head</title>
</head>
<body>
<header>
<h1>Document metadata projects from the head</h1>
<!-- 9.1.1: every p inside the header, in document order. -->
<p>The first paragraph of the argument.</p>
<p>The second paragraph of the argument.</p>
</header>
<main>
<!-- 9.4: depth-first document order for every array. -->
<section class="task" id="task-first" data-state="done">
<h2>The first task</h2>
</section>
<section class="task" id="task-second" data-state="in-progress">
<h2>The second task</h2>
</section>
<section class="task" id="task-third" data-state="todo">
<h2>The third task</h2>
</section>
</main>
</body>
</html>
