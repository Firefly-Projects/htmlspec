<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="htmlspec-version" content="0.1.0">
<meta name="htmlspec-kind" content="specification">
<title>Malformed scenario bodies</title>
</head>
<body>
<main>
<section class="requirement" id="req-malformed-bodies">
<h2>A malformed scenario body is invalid</h2>
<p>The system MUST reject a body it cannot read.</p>

<!-- 4.2: a dd with no preceding dt, then a label outside the set, then a dt
     with no following dd. -->
<article class="scenario" id="scenario-malformed">
<h3>Three faults in one body</h3>
<dl>
<dd>An entry with no label.</dd>
<dt>Whenever</dt>
<dd>A label outside the set.</dd>
<dt>Then</dt>
</dl>
</article>
</section>
</main>
</body>
</html>
