<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="htmlspec-version" content="0.1.0">
<meta name="htmlspec-kind" content="tasks">
<title>A task with two accounts of what was done</title>
</head>
<body>
<main>
<!-- 4.5.1: two deviation paragraphs in one task. The projection does not choose
     between two accounts of what was done, so the document is invalid. The first
     is kept, because a reader of an unvalidated projection would otherwise read
     the task as done as written. -->
<section class="task" id="task-two-accounts" data-state="done">
<h2>Add the subcommand to the hand-written list</h2>
<p data-field="deviation">The subcommand was covered by the command tree.</p>
<p data-field="deviation">No list was changed.</p>
</section>
</main>
</body>
</html>
