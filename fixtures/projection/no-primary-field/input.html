<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="htmlspec-version" content="0.1.0">
<meta name="htmlspec-kind" content="tasks">
<title>Units with no primary field</title>
</head>
<body>
<main>
<!-- 4.0.2, 4.5: a task, a verification, and a scenario have no primary field, so
     an unmarked paragraph projects into notes rather than being discarded or
     becoming a reason that would mean nothing. -->
<section class="task" id="task-prose" data-state="in-progress">
<h2>A task carrying prose</h2>
<p>Sequenced before the validator.</p>
</section>

<section class="task" id="task-dropped" data-state="dropped">
<h2>A dropped task states why</h2>
<p data-field="reason">No requirement asks for it.</p>
<p>And it would multiply the checks.</p>
</section>

<section class="verification" id="verify-prose" data-outcome="not-run" data-refs="req-elsewhere">
<h2>A verification carrying prose</h2>
<p>Not run: the formatter does not exist yet.</p>
</section>
</main>
</body>
</html>
