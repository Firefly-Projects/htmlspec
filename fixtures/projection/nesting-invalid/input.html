<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="htmlspec-version" content="0.1.0">
<meta name="htmlspec-kind" content="specification">
<title>Undefined nesting</title>
</head>
<body>
<main>
<!-- 4.3: a requirement nested inside another requirement. -->
<section class="requirement" id="req-outer">
<h2>The outer requirement</h2>
<p>The outer obligation MUST hold.</p>
<section class="requirement" id="req-inner">
<h3>The inner requirement</h3>
<p>The inner obligation MUST hold.</p>
</section>
<article class="scenario" id="scenario-outer">
<h3>The outer scenario</h3>
<dl>
<dt>When</dt>
<dd>It happens.</dd>
<dt>Then</dt>
<dd>It works.</dd>
</dl>
</article>
</section>

<!-- 4.3: a scenario outside a requirement. -->
<article class="scenario" id="scenario-orphaned">
<h2>An orphaned scenario</h2>
<dl>
<dt>When</dt>
<dd>It has no requirement.</dd>
<dt>Then</dt>
<dd>The document is invalid.</dd>
</dl>
</article>
</main>
</body>
</html>
