<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="htmlspec-version" content="0.1.0">
<meta name="htmlspec-kind" content="specification">
<title>Titles</title>
</head>
<body>
<main>
<!-- 3.1: the first heading among the unit's own descendants. -->
<!-- 3.2: a heading inside a presentational wrapper is deeper, so it does not
     make the name ambiguous; and a nested unit's heading belongs to it. -->
<section class="requirement" id="req-titled">
<h2>The unit's own name</h2>
<div class="callout">
<h2>A deeper heading in a wrapper</h2>
</div>
<p>The system MUST take the first heading at the shallowest depth.</p>
<article class="scenario" id="scenario-minimal">
<h3>A minimal scenario</h3>
<dl>
<dt>When</dt>
<dd>It happens.</dd>
<dt>Then</dt>
<dd>It works.</dd>
</dl>
</article>
</section>
</main>
</body>
</html>
