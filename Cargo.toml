[workspace]
resolver = "2"
members = ["crates/*", "conformance"]

[workspace.metadata.crane]
name = "htmlspec"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Firefly-Projects/htmlspec"
rust-version = "1.90"

# Every dependency is pinned to an exact version. `html5ever` is pinned exactly
# because the validator maps its recovered parse-error messages onto stable
# project-owned diagnostic codes, and a version bump can reword a message.
# `kuchikiki` selects the html5ever/markup5ever tree, so both move together.
[workspace.dependencies]
html5ever = "=0.35.0"
kuchikiki = "=0.8.9-speedreader"
markup5ever = "=0.35.0"
tendril = "=0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `default-features = false` removes the resolver that fetches remote `$ref`
# targets, so validation cannot reach the network.
jsonschema = { version = "0.49.6", default-features = false }
regress = "0.10"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
# The interactive selection `init` offers. Pinned exactly like every other dependency,
# because the reproducible-build requirement says two machines must agree. Confined to
# `prompt.rs`: nothing else in the program references it, so replacing it is one module.
inquire = "=0.7.5"
# Killing a probe's process group rather than only the process this program started. A preflight
# probe runs `nix eval`, which can fork, and a timeout that killed only the direct child would leave
# its descendants running after the command reported. `std` puts a child in its own group but offers
# no way to signal one, and the workspace forbids `unsafe_code`, so the group kill comes from here.
# Pinned exactly like every other dependency, and confined to `preflight/host.rs`: nothing else in
# the program starts a process.
command-group = "=5.0.1"
# Raising a cancellation flag when the operator interrupts. Already in the tree through `inquire`, so
# this adds no vendored subtree; it is named here because `preflight/host.rs` uses it directly and a
# dependency reached through another crate is one a bump can remove without notice. Pinned exactly
# like every other dependency.
signal-hook = "=0.3.18"
anyhow = "1.0"
thiserror = "2.0"
typify = "0.7.0"
schemars = "0.8"
prettyplease = "0.2"
syn = "2.0"
insta = "1.43"
proptest = "1.7"
pretty_assertions = "1.4"

htmlspec-schema = { version = "=1.0.0", path = "crates/htmlspec-schema" }
htmlspec-parse = { version = "=1.0.0", path = "crates/htmlspec-parse" }
htmlspec-format = { version = "=1.0.0", path = "crates/htmlspec-format" }
htmlspec-validate = { version = "=1.0.0", path = "crates/htmlspec-validate" }
htmlspec-assets = { version = "=1.0.0", path = "crates/htmlspec-assets" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
