# This repository's tools are the subcommands of one binary in the `htmlspec-xtask` member, and
# this alias runs them: `cargo xtask TOOL`, from the repository's root, where `scripts/check`, the
# workflows, and the runbooks' steps run. `--locked`, as every stage of `scripts/check` passes, so a
# tool never runs against a lockfile the manifests disagree with, and `--quiet`, so a tool's own
# output is all a stage prints.
[alias]
xtask = "run --quiet --locked -p htmlspec-xtask --"
